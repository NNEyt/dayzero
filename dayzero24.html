function dzInit(){
 if(!S)return null;
 if(!S.dx||typeof S.dx!=="object")S.dx={};
 const d=S.dx;
 if(!Array.isArray(d.inventory))d.inventory=[];
 if(!d.searched||typeof d.searched!=="object")d.searched={};
 for(const id of Object.keys(DZ_LOC))if(!Number.isSafeInteger(d.searched[id])||d.searched[id]<0)d.searched[id]=0;
 if(!d.used||typeof d.used!=="object")d.used={};
 if(!d.clues||typeof d.clues!=="object")d.clues={};
 if(!Array.isArray(d.history))d.history=[];
 if(!Number.isInteger(d.coldShield)||d.coldShield<0)d.coldShield=0;
 return d;
}
function dzHas(id){return dzInit().inventory.includes(id)}
function dzOpen(id){
 if(id==="hall")return S.round>=1;
 if(id==="tower")return !!S.f.acc;
 if(id==="clinic")return S.round>=2&&!!(S.th.T1&&S.th.T1.res);
 return false;
}
function dzNext(id){
 const d=dzInit(),loc=DZ_LOC[id];if(!loc||!dzOpen(id))return null;
 const item=loc.ids[d.searched[id]];
 if(!item||dzHas(item))return null;
 if(item==="blankets"&&S.round<3)return null;
 return item;
}
function dzFind(id){
 const item=dzNext(id),d=dzInit();if(!item)return "✖ Nothing else can be found here right now.";
 d.inventory.push(item);d.searched[id]++;
 d.history.push({round:S.round,action:"found",item:item,place:id});
 return "🎒 Discovered "+DZ_ITEMS[item].icon+" "+DZ_ITEMS[item].name+" at "+DZ_LOC[id].name+". Added to the team's shared inventory.";
}
function dzRemove(id){const d=dzInit(),i=d.inventory.indexOf(id);if(i>=0)d.inventory.splice(i,1)}
function dzCan(id){
 const d=dzInit();if(d.used[id])return false;
 if(id==="receiver")return S.round>=2&&dzHas("batteries")&&dzHas("receiver");
 if(id==="blankets")return S.round>=3&&dzHas("blankets")&&!d.coldShield;
 if(id==="log")return S.round>=2&&dzHas("log");

 return false;
}
function dzUse(id){
 if(!dzCan(id))return "✖ Required equipment or conditions are missing.";
 const d=dzInit();let result="";
 if(id==="receiver"){
  dzRemove("batteries");S.a.signal=Math.min(6,S.a.signal+1);d.clues.dispatch=1;
  result="📡 Theo tunes the receiver. Signal +1 (maximum 6). An earlier-dated grid-crew transmission is recorded in the evidence journal. It does not prove sabotage.";
 }else if(id==="blankets"){
  dzRemove("blankets");d.coldShield=1;
  result="🧣 Pavel distributes thermal blankets. The next eligible cold-related Health loss will be reduced by 1.";
 }else if(id==="log"){
  d.clues.service=1;
  result="📋 The clinic service log contains a maintenance work order dated before the blackout. Its significance is unclear. Evidence added to the journal.";
 }else if(id==="route"){
  S.f.guide=1;
  result="🗺️ Marta uses the sketch and worklight to locate a service route. The grid crew still needs fuel and radio coordination.";
 }
 d.used[id]=1;d.history.push({round:S.round,action:"used",item:id});
 return result;
}
function dzCold(n,E){
 const d=dzInit();let penalty=n;
 if(n>0&&d.coldShield){penalty=Math.max(0,n-1);d.coldShield=0;E.push("🧣 Thermal blankets prevent 1 point of cold-related Health loss.");}
 tr("health",-penalty);return penalty;
}
function dzJournal(){

}

 }).join(""):'<p class="dx-note">No equipment discovered yet. Search locations using available actions, but remember that time is limited.</p>';

 }).join("");
 return '<div class="sec">🎒 Discovered equipment</div><div class="pn"><div class="dz23-item-grid">'+possessions+'</div>'+
 (d.coldShield?'<p class="dx-note">🧣 Thermal protection ready: the next cold-related Health loss is reduced by one.</p>':"")+'</div>'+
 '<details class="pn dz23-drawer"><summary>🗺️ Explore Kelderwick · view locations</summary><p class="dx-note">Searching uses one role action. Equipment found belongs to the whole team.</p><div class="dx-grid">'+locs+'</div></details>'+
 '<details class="pn dz23-drawer"><summary>🔎 Evidence journal · '+ev.length+' clue'+(ev.length===1?"":"s")+'</summary>'+(ev.length?ev.map(e=>'<p>'+esc(e)+'</p>').join(""):'<p class="dx-note">No physical evidence investigated yet.</p>')+'</details>';
}

function dzEpilogue(){
 const d=dzInit(),a=!!d.clues.service,b=!!d.clues.dispatch;

if(S.th.T1)o.push(S.th.T1.fail?"The clinic's patients were moved out of town in the night.":S.th.T1.res?"The clinic never went dark.":"");
if(S.th.T8)o.push(S.th.T8.res?"Mrs Petrova's house was damaged, but everyone got out.":S.th.T8.fail?"The fire spread to two houses. Everyone got out, but some lost everything.":"");
if(S.hub.water&&!S.f.dry)o.push("You filled the containers before the taps went dry.");
if(S.th.T9&&S.th.T9.res)o.push("The thieves story stopped with the hall's radio.");return o}
const goal=()=>`<div class="goal">🎯 <b>This round:</b> ${GOAL[S.round]}</div>`;
const foot=()=>`<p class="c"><button class="btn b sm2" onclick="restart()">New game</button></p>`;
function title(){const s0=localStorage.getItem("dz2_story24_dual");return `<h1>DAY ZERO</h1><p class="c" style="color:#c9c3ad"><i>The lights go out. Nobody has the whole picture.</i></p><div class="row">${card({t:"Lights Out",a:"ev1",i:"🌑",f:"A town goes dark. Your neighbours need you.",b:"1–4 players · about 75 minutes · choose your TV setup.",g:"A CRISIS ADVENTURE"})}</div><div class="pn"><h2>Who is playing?</h2>${[0,1,2,3].map(i=>`<input id="n${i}" placeholder="Player ${i+1} name${i?" (optional)":""}">`).join("")}<p class="s">Four roles are shared between players. Best with 3–4. One player = practice mode.</p><div class="c"><button class="btn" onclick="go()">Start</button>${s0?'<button class="btn b" onclick="cont()">Continue saved game</button>':""}</div></div>`}
function go(){const n=[0,1,2,3].map(i=>document.getElementById("n"+i).value.trim()).filter(x=>x);if(!n.length)n.push("Player 1");start(n)}

function vTeam(){const own=r=>S.pl.find(p=>p.r.includes(r)).n;
return `<h2>The Story</h2><div class="pn" style="font-size:20px">Kelderwick is a small town. It's a cold Thursday evening in November. Suddenly, <b>the power goes out across the whole town</b>, and nobody knows for how long.<br><br>You are neighbours who meet at the <b>Mill Lane community hall</b>. People are scared. Someone has to organise things. That's you.<br><br><b>Your mission:</b> keep Mill Lane going for 3 days until the power returns, and turn the hall into a <b>Community Hub</b> with 🔥 Warmth, 💧 Water and 📻 Information.</div>
<div class="sec">🏆 How you win</div><div class="pn">⭐ <b>Mission:</b> get all 3 Hub systems running by the end.<br>⭐ <b>People:</b> keep ❤️ Health high.<br>⭐ <b>Community:</b> keep 🤝 Cohesion and 🏘️ Trust high.<br>Up to 9 stars. Your choices decide which of 7 endings you get.</div>
<div class="sec">👥 Meet your team</div><p class="c"><b>Nobody has the whole picture.</b> Each role receives different information each round. Cooperate by sharing what you learn.</p>
${RO.map(r=>`<div class="rb" style="border-color:${RL[r].c}"><h3 style="color:${RL[r].c}">${RL[r].i} ${RL[r].n}: played by ${esc(own(r))}</h3><b>Who:</b> ${ROLEX[r].who}<br><b>Knows:</b> ${ROLEX[r].knows}<br><b>Can do:</b> ${ROLEX[r].does}<br><b>Why it matters:</b> ${ROLEX[r].why}</div>`).join("")}
${dz21Setup()}<div class="sec">🎒 Your resources</div>${guideH()}<div class="c"><button class="btn" onclick="startRound()">Start Round 1</button></div>`}
function vBrief(){const e=EV[S.round];let h=`<h2>Round ${S.round} · ${e[0]}</h2>${goal()}<p class="c s"><b>Coordinator:</b> read each new problem card aloud so everyone knows what the team is facing. Then deal private information cards.</p><div class="row">`;
if(S.round<=2)h+=card({t:"How to Play",a:"teach",i:"📖",b:S.round===1?TEACH1:TEACH2,g:"COORDINATOR READS ALOUD"});h+="</div>";
if(S.br.length)h+=`<div class="sec">↩️ Because of earlier choices</div><div class="row">${S.br.map(b=>card({t:b.t,a:"echo",i:"↩️",f:b.x,b:b.w?"<i>"+b.w+"</i>":"",g:b.w?"ECHO":"NEWS",sm:1})).join("")}</div>`;
if(S.nw.length)h+=`<div class="sec">⚠️ New problems</div><div class="row">${S.nw.map(thC).join("")}</div>`;
return h+`<div class="sec">🏘️ Your town</div>`+board()+`<div class="c"><button class="btn" onclick="S.ph='intel';S.pi=0;S.show=false;sv();R()">Deal private cards</button></div>`+foot()}
function roleBox(r){return `<div class="rb" style="border-color:${RL[r].c}"><h3 style="color:${RL[r].c}">${RL[r].i} You are the ${RL[r].n} (${RL[r].ch})</h3><b>Your job:</b> ${ROLEX[r].does}<br><span class="s">${ROLEX[r].why}</span></div>`}
function vPass(){const p=S.pl[S.pi],rs=p.r.map(r=>RL[r].i+" "+RL[r].n).join(" & ");
if(!S.show)return `<div class="pn c"><h2>${S.ph==="intel"?"Private cards":"Secret orders"}</h2><p style="font-size:28px">Pass the device to<br><b style="color:#ffd166;font-size:44px">${esc(p.n)}</b><br>${rs}</p><p class="s">Everyone else, look away.</p><button class="btn" onclick="S.show=true;R()">I'm ${esc(p.n)}: show me</button></div>`;
if(S.ph==="intel"){let h=`<h2>${esc(p.n)}'s private cards</h2><p class="c">These cards give you information your teammates may not have. At the council, <b>share what you know</b> by reading or explaining it. Pay attention to whether a card is verified, unconfirmed or a rumour.</p>`;
p.r.forEach(r=>{h+=roleBox(r)+`<div class="row">`;(IN[S.round][r]||[]).forEach(x=>{h+=card({t:RL[r].i+" "+RL[r].n,a:"r_"+r,i:RL[r].i,c:RL[r].c,sm:1,b:`<span class="rel ${x[0]}">${{V:"✔ VERIFIED",U:"? UNCONFIRMED",R:"~ RUMOUR"}[x[0]]}</span><div class="${x[2]?"sk":""}">${x[1]}</div>`,g:RL[r].ch})});h+="</div>"});
return h+`<div class="c"><button class="btn" onclick="next()">Hide my cards</button></div>`}
let h=`<h2>${esc(p.n)}: choose secretly</h2>`+dzPanel();
p.r.forEach(r=>{const op=opts(r),n=nA(r);let o='<option value="">— No action —</option>';for(const g in GRP){const l=op.filter(t=>GRP[g].includes(t.id));if(l.length)o+=`<optgroup label="${g}">${l.map(t=>`<option value="${t.id}">${esc(t.label+ctx(cost(t)))}</option>`).join("")}</optgroup>`}
h+=roleBox(r)+dz22RolePrompt(r)+`<div class="pn"><b>${n} action${n>1?"s":""}:</b><p class="s">Discussed the plan with your team? Choose your actions below. Some require another role\'s action to succeed.</p>`;for(let i=0;i<n;i++)h+=`<select id="o_${r}_${i}">${o}</select>`;h+="</div>"});
return h+`<p class="c s">Actions are grouped by problem. Costs are paid when the action happens. Some actions need another role to act first or in the same round.</p><div class="c"><button class="btn" onclick="lock()">Lock in &amp; hide</button></div>`}
function vCouncil(){let h=`<h2>Your Team · Round ${S.round}</h2>`+dz22CouncilScene()+goal()+`<div class="pn"><b>1.</b> Share each role\'s information aloud. <b>2.</b> Discuss who will do what, and what depends on another player. <b>3.</b> ${S.dl?"Make the group decision below.":"Agree on your plan."}<br><span class="s">Coordinator: ${esc(S.pl[S.co].n)}. Everyone speaks; the coordinator reads the story and breaks ties.</span></div>`;
if(S.dl){const d=DL[S.dl];h+=`<div class="sec">⚖️ Decision</div><div class="row">${card({t:d[1],a:S.dl.toLowerCase(),i:d[2],f:d[3],b:d[0]?`<b>Decided by the ${RL[d[0]].n}</b> after listening to everyone.`:"<b>Group decision:</b> everyone speaks once, the Coordinator speaks last, then vote.",g:"DILEMMA"})}<div class="pn" style="max-width:460px">${d[4].map((o,i)=>`<button class="btn opt ${S.dc===o[0]?"":"b"}" ${S.dc?"disabled":""} onclick="choose('${o[0]}')">Option ${"ABC"[i]}: ${o[1]}<div>⚡ <b>Now:</b> ${o[2]}</div><div>🔮 <b>Later:</b> ${o[5]}</div></button>`).join("")}${S.dc?"<p>✔ Decided.</p>":""}</div></div>`}
const A=Object.keys(S.th).filter(act);if(A.length)h+=`<div class="sec">⚠️ Problems right now</div><div class="row">${A.map(thC).join("")}</div>`;
return h+`<div class="sec">🏘️ Your town</div>`+board()+dzPanel()+`<div class="c"><button class="btn" ${S.dl&&!S.dc?"disabled":""} onclick="S.ph='ord';S.pi=0;S.show=false;sv();R()">Go to secret orders</button></div>`}
const lg=a=>`<div class="pn lg">${a.map(x=>`<p class="${x.includes("✖")?"no":x.includes("✅")?"ok":""}">${x}</p>`).join("")}</div>`;
function vRes(){return dz22Results()}
function vEsc(){const nx=S.round<7?`<div class="goal">🔜 <b>Coming next:</b> Round ${S.round+1}: ${EV[S.round+1][0]}</div>`:"";return `<h2>End of Round ${S.round}</h2>${dz21Outro()}<div class="sec">⏰ Time passes…</div>${dz22TimePassage()}${dif(S.pre)}${nx}<div class="sec">🏘️ Your town</div>${board()}<div class="c"><button class="btn" onclick="nextRound()">${S.round>=7?"See the ending":"Next round"}</button></div>`}
function vEnd(){const z=ending(),st=n=>"★".repeat(n)+"☆".repeat(3-n),cod=[...S.codas];if(S.d6)cod.push(S.f.d6?DL.DL6[4].find(x=>x[0]===S.d6)[4]:"The council decided without you. The power came later.");
return `<h1 style="font-size:56px">${z.e[0]}</h1><div class="row">${card({t:z.e[0],a:"end",i:"🏁",f:z.e[1]+z.x,g:"YOUR ENDING"})}</div>
<div class="pn c"><div class="st">Mission ${st(z.m)} · People ${st(z.p)} · Community ${st(z.c)}</div></div>${dz21Finale()}
<div class="pn"><h2>Your Story</h2>${outc().concat(cod).filter(x=>x).map(x=>"<p>• "+x+"</p>").join("")}</div>
<div class="pn"><h2>What Fooled You?</h2>${FOOL.map(f=>`<p><b>${f[0]}</b>: ${f[1]}</p>`).join("")}<p><i>Rumours spread fastest when people are scared. Always ask: how do we know?</i></p></div>
<div class="pn"><h2>Field Notes</h2>${NOTES.map(n=>`<p><span class="rel ${n[0]==="Real"?"V":"U"}">${n[0]}</span> ${n[1]}</p>`).join("")}<p class="s">General guidance only. Check your local official advice.</p></div>
<div class="pn"><h2>Talk About It</h2><p>1. Which rumour fooled you, and why?</p><p>2. What would our household need for 72 hours?</p><p>3. Who in our street might need help in a blackout?</p><p>4. Which decision would you change?</p><p>5. When is it right to share something you can't prove?</p></div>
<div class="pn"><h2>What Happens Next?</h2><p><i>Two weeks later, the grid operator's report blames “equipment failure.” But one photo still bothers you: the substation lock wasn't forced. Someone had a key. To be continued…</i></p><p>${esc(dzEpilogue())}</p></div>
<div class="c"><button class="btn" onclick="localStorage.removeItem('dz2_story24_dual');S=null;R()">Play again</button></div>`}

R();
