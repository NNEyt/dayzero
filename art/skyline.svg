<g fill="#ffc24a"><rect x="268" y="104" width="10" height="12" opacity=".7"/><rect x="330" y="160" width="10" height="12" opacity=".45"/><rect x="290" y="232" width="10" height="12" opacity=".6"/></g>
<g fill="#1a2547"><rect x="268" y="132" width="10" height="12"/><rect x="290" y="104" width="10" height="12"/><rect x="312" y="132" width="10" height="12"/><rect x="330" y="104" width="10" height="12"/><rect x="290" y="160" width="10" height="12"/><rect x="268" y="188" width="10" height="12"/><rect x="312" y="188" width="10" height="12"/><rect x="340" y="216" width="10" height="12"/><rect x="268" y="244" width="10" height="12"/><rect x="312" y="260" width="10" height="12"/></g>
<!-- terraced houses -->
<path fill="url(#near)" d="M0 320 V250 L40 222 L80 250 L120 222 L160 250 V320Z M400 320 V246 L440 216 L480 246 L520 216 L560 246 L600 216 L640 246 V320Z M700 320 V258 L735 232 L770 258 L805 232 L840 258 V320Z M880 320 V240 L930 206 L980 240 L1030 206 L1080 240 V320Z M1240 320 V250 L1280 220 L1320 250 L1360 220 L1400 250 L1440 220 L1480 250 V320Z M1500 320 V256 L1550 230 L1600 256 V320Z"/>
