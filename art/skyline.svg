<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" preserveAspectRatio="xMidYMax slice">
<!-- Day Zero background: Kelderwick at night during the blackout. Original artwork for this project. -->
<defs><linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#152040"/><stop offset="1" stop-color="#0d1530"/></linearGradient>
<linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1328"/><stop offset="1" stop-color="#080d1d"/></linearGradient></defs>
<!-- far hills and roofs -->
<path fill="url(#far)" d="M0 230 Q120 200 260 214 T540 206 T820 214 T1100 200 T1380 212 T1600 204 V320 H0Z"/>
<!-- church spire -->
<path fill="url(#far)" d="M1180 210 V150 L1192 96 L1204 150 V210Z"/>
