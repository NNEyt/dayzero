name: Rebuild Day Zero Pages
on:
  push:
    paths:
      - '.github/workflows/unblock-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "Pages status before build request"
          gh api "repos/$REPO/pages" --jq '{status,build_type,source,html_url}' || true
          echo "Requesting a new build on the current source branch"
          if gh api -X POST "repos/$REPO/pages/builds"; then
            echo "BUILD_REQUEST_ACCEPTED"
          else
            echo "BUILD_REQUEST_REFUSED"
          fi
          sleep 5
          echo "Latest Pages build"
          gh api "repos/$REPO/pages/builds/latest" --jq '{status,error,commit,created_at}' || true
          echo "Current Pages status"
          gh api "repos/$REPO/pages" --jq '{status,build_type,source}' || true
