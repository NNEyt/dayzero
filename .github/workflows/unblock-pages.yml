name: Repair Day Zero Pages source
on:
  push:
    paths:
      - '.github/workflows/unblock-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Pages source and permissions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "Current Pages site configuration:"
          gh api "repos/$REPO/pages" --jq '{url, status, build_type, source}' || true
          echo "Try switching to branch deployment, retaining main and root:"
          if gh api -X PUT "repos/$REPO/pages" \
               -f build_type=legacy \
               -f 'source[branch]=main' \
               -f 'source[path]=/'; then
            echo "CHANGE_ACCEPTED"
            gh api "repos/$REPO/pages" --jq '{url, status, build_type, source}' || true
            echo "Requesting new Pages build:"
            gh api -X POST "repos/$REPO/pages/builds" || true
          else
            echo "CHANGE_REFUSED_OR_UNAVAILABLE"
            gh api "repos/$REPO/pages" --jq '{url, status, build_type, source}' || true
          fi
