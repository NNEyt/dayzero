name: Recover stuck Day Zero Pages deployment
on:
  push:
    paths:
      - '.github/workflows/unblock-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pages: write
jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel old queued workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          gh api --method POST "repos/${{ github.repository }}/actions/runs/38594096889/force-cancel" && echo "Cancelled old queued workflow." || echo "Old run may already have completed; continuing."
      - name: Cancel stalled Pages deployment and diagnose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          echo "Status before cancellation:"
          gh api "repos/${{ github.repository }}/pages/deployments/0959ebcd5fdb86200336cbeb1610e502955981f1" || true
          echo "Requesting cancellation:"
          gh api --method POST "repos/${{ github.repository }}/pages/deployments/0959ebcd5fdb86200336cbeb1610e502955981f1/cancel" && echo "Cancellation accepted." || true
          sleep 15
          echo "Status after cancellation:"
          gh api "repos/${{ github.repository }}/pages/deployments/0959ebcd5fdb86200336cbeb1610e502955981f1" || true
