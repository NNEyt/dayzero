name: Release old Day Zero deployment lock
on:
  push:
    paths:
      - '.github/workflows/unblock-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and delete only stalled deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STUCK_SHA: 0959ebcd5fdb86200336cbeb1610e502955981f1
        run: |
          set -euo pipefail
          echo "Looking for Deployment API records tied to known failed commit."
          DEPLOYMENTS="$(gh api "repos/$REPO/deployments?sha=$STUCK_SHA" --jq '.[] | select(.sha == env.STUCK_SHA and .environment == "github-pages") | .id')" || exit 1
          if [ -z "$DEPLOYMENTS" ]; then
            echo "No matching GitHub Deployments API records. Stale Pages service state needs GitHub support."
            exit 0
          fi
          while read -r ID; do
            [ -z "$ID" ] && continue
            echo "Cleaning only github-pages deployment ID $ID on commit $STUCK_SHA"
            gh api --method POST "repos/$REPO/deployments/$ID/statuses" -f state=inactive -f description="Cancel orphaned failed Pages deployment" || true
            gh api --method DELETE "repos/$REPO/deployments/$ID"
          done <<< "$DEPLOYMENTS"
